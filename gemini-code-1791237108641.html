<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Premier Test GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1117, #161b22);
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #8b949e;
        }

        .badge {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Mon premier commit !</h1>
        <p>Si tu vois cette page, c'est que ton fichier HTML/CSS a été envoyé avec succès sur ton dépôt GitHub.</p>
        <span class="badge">Test réussi !</span>
    </div>

</body>
</html>
